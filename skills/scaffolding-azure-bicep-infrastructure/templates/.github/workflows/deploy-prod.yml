name: Deploy to Production

on:
  push:
    branches:
      - production

permissions:
  id-token: write   # Required for OIDC login to Azure
  contents: read

# A newer push supersedes an in-flight run on TEST (cancel it — saves paid Actions minutes).
# On PROD never cancel: a half-applied prod deploy is worse than a queued one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Required for git diff to work across multi-commit pushes

      # -----------------------------------------------------------------------
      # 1. Detect whether any infra/ files changed.
      #    Steps 3 and 4 are skipped for frontend/API-only pushes, saving
      #    3–5 minutes per run. Defaults to true on first push (all-zeros SHA).
      # -----------------------------------------------------------------------
      - name: Check for infra changes
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "infra_changed=true" >> $GITHUB_OUTPUT
          else
            changed=$(git diff --name-only "$before" "${{ github.sha }}")
            if echo "$changed" | grep -qE '^infra/'; then
              echo "infra_changed=true" >> $GITHUB_OUTPUT
            else
              echo "infra_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      # -----------------------------------------------------------------------
      # 2. Login to Azure via OIDC — separate service principal from test,
      #    so production credentials are never accessible from test pipelines.
      # -----------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PROD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # -----------------------------------------------------------------------
      # 3. Deploy infrastructure via Bicep
      #    Skipped when no infra/ files changed.
      # -----------------------------------------------------------------------
      - name: Deploy Infrastructure (Bicep)
        id: infra
        if: steps.changes.outputs.infra_changed == 'true'
        env:
          SQL_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD_PROD }}
        run: |
          result=$(az deployment sub create \
            --name "deploy-prod-${{ github.run_id }}" \
            --location "$(jq -r '.parameters.location.value // "australiaeast"' infra/environments/prod.parameters.json)" \
            --template-file infra/main.bicep \
            --parameters @infra/environments/prod.parameters.json \
            --parameters sqlAdminPassword="$SQL_PASSWORD" \
            --query "properties.outputs" \
            --output json)

          SWA_TOKEN=$(echo "$result" | jq -r '.swaDeploymentToken.value')
          SQL_FQDN=$(echo "$result"  | jq -r '.sqlServerFqdn.value')
          SQL_DB=$(echo "$result"    | jq -r '.sqlDbName.value')
          SWA_NAME=$(echo "$result"  | jq -r '.swaName.value')

          RG_NAME=$(echo "$result" | jq -r '.resourceGroupName.value')

          # Mask the deployment token so it never appears in logs
          echo "::add-mask::$SWA_TOKEN"

          echo "swaToken=$SWA_TOKEN"             >> "$GITHUB_OUTPUT"
          echo "sqlFqdn=$SQL_FQDN"               >> "$GITHUB_OUTPUT"
          echo "sqlDb=$SQL_DB"                   >> "$GITHUB_OUTPUT"
          echo "swaName=$SWA_NAME"               >> "$GITHUB_OUTPUT"
          echo "resourceGroupName=$RG_NAME"      >> "$GITHUB_OUTPUT"

          # Optional module outputs (empty string when the toggle is off)
          AI_CONN=$(echo "$result" | jq -r '.appInsightsConnectionString.value // empty')
          if [ -n "$AI_CONN" ]; then
            echo "::add-mask::$AI_CONN"
            echo "appInsightsConnectionString=$AI_CONN" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # 4. Run SQL migrations
      #    Installs sqlcmd explicitly (not pre-installed on ubuntu-24.04),
      #    manages the firewall rule manually, and runs all *.sql files in
      #    alphabetical order. The trap ensures the firewall rule is removed
      #    even if the step fails.
      #    Skipped when no infra/ files changed.
      # -----------------------------------------------------------------------
      - name: Run SQL Migrations
        # Only when infra ran AND the SQL module was deployed (deploySql may be false).
        if: steps.changes.outputs.infra_changed == 'true' && steps.infra.outputs.sqlFqdn != ''
        env:
          SQL_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD_PROD }}
        run: |
          SQL_SERVER="${{ steps.infra.outputs.sqlFqdn }}"
          SQL_DB="${{ steps.infra.outputs.sqlDb }}"
          SQL_SERVER_NAME="${SQL_SERVER/.database.windows.net/}"
          RG="${{ steps.infra.outputs.resourceGroupName }}"
          RULE_NAME="github-runner-${{ github.run_id }}"
          SQL_USER=$(jq -r '.parameters.sqlAdminLogin.value // "sqladmin"' infra/environments/prod.parameters.json)

          # Guarantee firewall rule removal on exit, even if the step fails
          trap 'echo "Cleaning up firewall rule..."; az sql server firewall-rule delete \
            --resource-group "$RG" --server "$SQL_SERVER_NAME" \
            --name "$RULE_NAME" --yes 2>/dev/null || true' EXIT

          # Install sqlcmd — not pre-installed on GitHub's ubuntu-latest (24.04) runners.
          # scripts/ci/install-sqlcmd.sh is the single source of truth (copied from the
          # managing-azure-sql-migrations skill): gpg --batch --yes + sudo tee + mssql-tools18.
          bash scripts/ci/install-sqlcmd.sh
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd

          # Add runner IP to SQL firewall temporarily
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Adding firewall rule for $RUNNER_IP..."
          az sql server firewall-rule create \
            --resource-group "$RG" --server "$SQL_SERVER_NAME" \
            --name "$RULE_NAME" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP"

          # Run all migration files in alphabetical order (nullglob + sorted read loop —
          # no `ls` parsing, whitespace-safe). `-b` makes sqlcmd exit non-zero on a T-SQL
          # error; without it a failed migration reports success.
          shopt -s nullglob
          files=(infra/sql/migrations/*.sql)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Running migration: $f"
            "$SQLCMD" -S "$SQL_SERVER" -d "$SQL_DB" \
              -U "$SQL_USER" -P "$SQL_PASSWORD" -i "$f" -C -b
          done < <(printf '%s\n' "${files[@]}" | sort)
          echo "All migrations completed successfully."

      # -----------------------------------------------------------------------
      # 5. Get SWA token for code-only deploys (Bicep was skipped).
      #    Derives SWA name from parameter file so no hardcoding is needed.
      #    No extra permissions required — OIDC login already grants access.
      # -----------------------------------------------------------------------
      - name: Get SWA token (code-only deploy)
        id: swa_token_fallback
        if: steps.changes.outputs.infra_changed == 'false'
        run: |
          ORG=$(jq -r '.parameters.org.value' infra/environments/prod.parameters.json)
          PROJECT=$(jq -r '.parameters.project.value' infra/environments/prod.parameters.json)
          SWA_NAME="${ORG}-${PROJECT}-swa-prod"
          RG_NAME="${ORG}-${PROJECT}-rg-prod"
          token=$(az staticwebapp secrets list \
            --name "$SWA_NAME" \
            --resource-group "$RG_NAME" \
            --query "properties.apiKey" \
            --output tsv)
          echo "::add-mask::$token"
          echo "swaToken=$token" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 6. Deploy frontend + managed API functions in a single action.
      #    Uses Bicep output token (step 3) when infra ran, fallback (step 5) otherwise.
      #    The SWA action (via Oryx) builds both the React app and the
      #    TypeScript Functions automatically.
      # -----------------------------------------------------------------------
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.infra.outputs.swaToken || steps.swa_token_fallback.outputs.swaToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          api_location: api

      # -----------------------------------------------------------------------
      # 7. Wire App Insights into the SWA managed functions (observability toggle on).
      #    SWA app settings survive code-only deploys, so this only needs to run
      #    when Bicep ran and produced a connection string.
      # -----------------------------------------------------------------------
      - name: Set APPLICATIONINSIGHTS_CONNECTION_STRING on SWA
        if: steps.changes.outputs.infra_changed == 'true' && steps.infra.outputs.appInsightsConnectionString != ''
        run: |
          az staticwebapp appsettings set \
            --name "${{ steps.infra.outputs.swaName }}" \
            --resource-group "${{ steps.infra.outputs.resourceGroupName }}" \
            --setting-names APPLICATIONINSIGHTS_CONNECTION_STRING="${{ steps.infra.outputs.appInsightsConnectionString }}" \
            --output none
